  <style>
    .neon { animation: flicker 6s infinite steps(1, end); }
    .shadow { fill: none; stroke: #7A1020; stroke-width: 1.6; stroke-linecap: square; }
    .sub { font: 700 15px 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; fill: #FF8599; letter-spacing: 8px; word-spacing: 18px; }
    .tag { font: 600 11px Consolas, 'DejaVu Sans Mono', monospace; fill: #6B6B78; letter-spacing: 2px; }
    .scanline { animation: roll 8s linear infinite; }
    /* Irregular off-beats mimic a failing neon tube instead of a uniform blink. */
    @keyframes flicker {
      0%, 18%, 22%, 60%, 63%, 100% { opacity: 1; }
      19%, 61% { opacity: 0.35; }
      20% { opacity: 0.85; }
      62% { opacity: 0.6; }
    }
    @keyframes roll { from { transform: translateY(-40px); } to { transform: translateY(292px); } }
    @media (prefers-reduced-motion: reduce) { .neon, .scanline { animation: none; } }
  </style>

