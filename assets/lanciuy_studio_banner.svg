<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 136" width="860" height="136" role="img" aria-label="LANCIUY">
  <defs>
    <!-- Background Radial Atmosphere -->
    <radialGradient id="deepAtmosphere" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#28030C"/>
      <stop offset="50%" stop-color="#120206"/>
      <stop offset="100%" stop-color="#050103"/>
    </radialGradient>

    <!-- Center Radiant Bloom -->
    <radialGradient id="centerBloom" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#99001A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Crimson Chrome Lettering Gradient -->
    <linearGradient id="chromeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="14%" stop-color="#FFA6B8"/>
      <stop offset="36%" stop-color="#FF1A44"/>
      <stop offset="65%" stop-color="#D60029"/>
      <stop offset="85%" stop-color="#8A0019"/>
      <stop offset="100%" stop-color="#38000B"/>
    </linearGradient>

    <!-- Deep Crimson Neon Glow Filter -->
    <filter id="crimsonHalo" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Diffused Atmospheric Blur -->
    <filter id="deepBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <!-- Subtle Scanline Texture -->
    <pattern id="fineScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <style>
    .banner-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Oswald', 'Trebuchet MS', 'Arial Black', sans-serif;
      font-size: 80px;
      font-weight: 900;
      letter-spacing: 16px;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .tech-tag {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #80303D;
    }

    /* Ambient pulse */
    @keyframes pulseAura {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .halo-layer {
      transform-origin: center center;
      animation: pulseAura 4.5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .halo-layer { animation: none; }
    }
  </style>

  <!-- Base Obsidian Void -->
  <rect width="860" height="136" rx="14" fill="url(#deepAtmosphere)"/>

  <!-- Center Atmospheric Red Halo -->
  <rect class="halo-layer" x="140" y="8" width="580" height="120" rx="50" fill="url(#centerBloom)" filter="url(#deepBloom)"/>

  <!-- Outer Frame: Precision 1px Crimson Border -->
  <rect x="0.5" y="0.5" width="859" height="135" rx="14" fill="none" stroke="#E50914" stroke-opacity="0.32" stroke-width="1"/>

  <!-- Cyber Studio Corner Accents -->
  <g stroke="#E50914" stroke-opacity="0.45" stroke-width="1.2" fill="none">
    <path d="M 22 28 L 22 20 L 30 20"/>
    <path d="M 830 20 L 838 20 L 838 28"/>
    <path d="M 22 108 L 22 116 L 30 116"/>
    <path d="M 830 116 L 838 116 L 838 108"/>
  </g>

  <!-- Technical Header Markers -->
  <text x="40" y="24" class="tech-tag">LANCIUY</text>
  <text x="820" y="24" class="tech-tag" text-anchor="end">STUDIO</text>

  <!-- Subtle Horizontal Horizon Guide Lines -->
  <line x1="60" y1="68.0" x2="150" y2="68.0" stroke="#E50914" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="150" cy="68.0" r="1.5" fill="#E50914" fill-opacity="0.45"/>

  <line x1="710" y1="68.0" x2="800" y2="68.0" stroke="#E50914" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="710" cy="68.0" r="1.5" fill="#E50914" fill-opacity="0.45"/>

  <!-- Chromatic Under-Glow (Cyan offset + Dark Crimson drop) -->
  <!-- dx="-8px" accounts for 16px letter-spacing centering -->
  <text x="430.0" y="68.0" dx="-6px" dy="1px" class="banner-text" fill="#00E5FF" fill-opacity="0.18" filter="url(#crimsonHalo)">LANCIUY</text>
  <text x="430.0" y="68.0" dx="-10px" dy="-1px" class="banner-text" fill="#7A0012" fill-opacity="0.85">LANCIUY</text>

  <!-- Main Hero Typography -->
  <text x="430.0" y="68.0" dx="-8px" class="banner-text" fill="url(#chromeRed)" filter="url(#crimsonHalo)">LANCIUY</text>

  <!-- Fine Atmospheric Scanline Layer -->
  <rect width="860" height="136" rx="14" fill="url(#fineScan)" pointer-events="none"/>
</svg>
